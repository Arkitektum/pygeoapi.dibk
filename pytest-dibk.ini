[pytest]
addopts = -q --tb=short --continue-on-collection-errors
    --ignore-glob=tests/*admin*
    --ignore-glob=tests/*django*
    --ignore-glob=tests/*elasticsearch*
    --ignore-glob=tests/*mongo*
    --ignore-glob=tests/*mysql*
    --ignore-glob=tests/*opensearch*
    --ignore-glob=tests/*oracle*
    --ignore-glob=tests/*postgresq*
    --ignore-glob=tests/*pubsub*
    --ignore-glob=tests/*sensorthings*
    --ignore-glob=tests/*xarray*
testpaths = tests
addopts_note = run with: pytest -c pytest-dibk.ini