server:
    bind:
        host: 0.0.0.0
        port: 5000
    url: http://localhost:5000
    mimetype: application/json; charset=UTF-8
    encoding: utf-8
    gzip: false
    languages:
        - en-US
    cors: true
    pretty_print: true
    limits:
        default_items: 10
        max_items: 10
    map:
        url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
        attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap contributors</a>'

logging:
    level: ERROR

metadata:
    identification:
        title:
            en: pygeoapi GeoJSON profile test instance
        description:
            en: pygeoapi instance with JSON-FG profile formatters
        keywords:
            en:
                - formatters
        keywords_type: theme
        terms_of_service: https://creativecommons.org/licenses/by/4.0/
        url: http://example.org
    license:
        name: CC-BY 4.0 license
        url: https://creativecommons.org/licenses/by/4.0/
    provider:
        name: Organization Name
        url: https://pygeoapi.io
    contact:
        name: Lastname, Firstname
        position: Position Title
        address: Mailing Address
        city: City
        stateorprovince: Administrative Area
        postalcode: Zip or Postal Code
        country: Country
        phone: +xx-xxx-xxx-xxxx
        fax: +xx-xxx-xxx-xxxx
        email: you@example.org
        url: Contact URL
        hours: Hours of Service
        instructions: During hours of service.  Off on weekends.
        role: pointOfContact

resources:
    obs:
        type: collection
        title:
            en: Observations
        description:
            en: Both JSON-FG variants and a non-GeoJSON formatter
        keywords:
            - observations
        extents:
            spatial:
                bbox: [-180, -90, 180, 90]
                crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
        providers:
            - type: feature
              name: tests.dibk.syntheticprovider.SyntheticProvider
              data: tests/data/obs.csv
              id_field: id
        formatters:
            - name: tests.dibk.profilestubs.GeoJsonFormatter
              f: jsonfg
              profiles: [jsonfg]
            - name: tests.dibk.profilestubs.GeoJsonFormatter
              f: jsonfg-plus
              profiles: [jsonfg-plus, jsonfg]
            - name: tests.dibk.syntheticprovider.InlineFormatter

    plain:
        type: collection
        title:
            en: Plain
        description:
            en: No custom formatters
        keywords:
            - observations
        extents:
            spatial:
                bbox: [-180, -90, 180, 90]
                crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
        providers:
            - type: feature
              name: tests.dibk.syntheticprovider.SyntheticProvider
              data: tests/data/obs.csv
              id_field: id

    legacy:
        type: collection
        title:
            en: Legacy
        description:
            en: A GeoJSON media type formatter that declares no profiles
        keywords:
            - observations
        extents:
            spatial:
                bbox: [-180, -90, 180, 90]
                crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
        providers:
            - type: feature
              name: tests.dibk.syntheticprovider.SyntheticProvider
              data: tests/data/obs.csv
              id_field: id
        formatters:
            - name: tests.dibk.profilestubs.GeoJsonFormatter
              f: legacyfg

    legacytype:
        type: collection
        title:
            en: Legacy media type
        description:
            en: JSON-FG under the media type of the JSON-FG drafts
        keywords:
            - observations
        extents:
            spatial:
                bbox: [-180, -90, 180, 90]
                crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
        providers:
            - type: feature
              name: tests.dibk.syntheticprovider.SyntheticProvider
              data: tests/data/obs.csv
              id_field: id
        formatters:
            - name: tests.dibk.profilestubs.GeoJsonFormatter
              f: jsonfg
              mimetype: application/vnd.ogc.fg+json
              profiles: [jsonfg]

    echo:
        type: collection
        title:
            en: Echo
        description:
            en: Passes unknown query parameters to the provider
        keywords:
            - observations
        extents:
            spatial:
                bbox: [-180, -90, 180, 90]
                crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
        providers:
            - type: feature
              name: tests.dibk.profilestubs.FilterEchoProvider
              data: tests/data/obs.csv
              id_field: id
              include_extra_query_parameters: true
