# Configuration for the custom formatter tests: a provider with a
# formatter-only property and two formatters over it, one rendered
# inline and one downloaded. Stubs in tests/dibk/syntheticprovider.py.

server:
    bind:
        host: 0.0.0.0
        port: 5000
    url: http://localhost:5000
    mimetype: application/json; charset=UTF-8
    encoding: utf-8
    gzip: false
    languages:
        - en-US
    cors: true
    pretty_print: true
    limits:
        default_items: 10
        max_items: 10

logging:
    level: ERROR

metadata:
    identification:
        title:
            en: pygeoapi formatter test instance
        description:
            en: pygeoapi instance with custom collection formatters
        keywords:
            en:
                - formatters
        keywords_type: theme
        terms_of_service: https://creativecommons.org/licenses/by/4.0/
        url: http://example.org
    license:
        name: CC-BY 4.0 license
        url: https://creativecommons.org/licenses/by/4.0/
    provider:
        name: Organization Name
        url: https://pygeoapi.io
    contact:
        name: Lastname, Firstname
        position: Position Title
        address: Mailing Address
        city: City
        stateorprovince: Administrative Area
        postalcode: Zip or Postal Code
        country: Country
        phone: +xx-xxx-xxx-xxxx
        fax: +xx-xxx-xxx-xxxx
        email: you@example.org
        url: Contact URL
        hours: Hours of Service
        instructions: During hours of service.  Off on weekends.
        role: pointOfContact

resources:
    obs:
        type: collection
        title:
            en: Observations
        description:
            en: My cool observations
        keywords:
            - observations
        extents:
            spatial:
                bbox: [-180, -90, 180, 90]
                crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
        providers:
            - type: feature
              name: tests.dibk.syntheticprovider.SyntheticProvider
              data: tests/data/obs.csv
              id_field: id
        formatters:
            - name: tests.dibk.syntheticprovider.InlineFormatter
            - name: tests.dibk.syntheticprovider.AttachmentFormatter
